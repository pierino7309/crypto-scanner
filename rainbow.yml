name: Rainbow chart giornaliero

on:
  schedule:
    - cron: "30 6 * * *"   # 08:30 ora legale italiana, 07:30 ora solare
  workflow_dispatch:        # per lanciarlo a mano dalla tab Actions

jobs:
  rainbow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ccxt requests
      - run: python rainbow_alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
