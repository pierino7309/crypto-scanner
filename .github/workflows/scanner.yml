name: Crypto Scanner

on:
  schedule:
    # Ogni ora, al minuto 0 (orario UTC)
    - cron: "0 * * * *"
  workflow_dispatch: {}   # permette anche l'avvio manuale da GitHub

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      # --- Allarmi BTC (livelli, movimenti forti, funding, open interest) ---
      - name: Restore BTC alert state
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: btc-alerts-${{ github.run_id }}
          restore-keys: btc-alerts-

      - name: Run BTC alerts
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BTC_LEVELS: "80000,88000"
        run: python btc_alerts.py

      - name: Save BTC alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: btc-alerts-${{ github.run_id }}
