name: Allarmi BTC

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  btc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Restore BTC alert state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: btc-alerts-${{ github.run_id }}
          restore-keys: btc-alerts-

      - name: Run BTC alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BTC_LEVELS: "80000,88000"
        run: python btc_alerts.py

      - name: Save BTC alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: btc-alerts-${{ github.run_id }}
